clinical_training:
  - period: "2014–2016"
    text: "Postgraduate Clinical Residency (two-year rotation), Kainan Hospital, Aichi, Japan"

projects:
  - title: "Franco-Japanese pharmacoepidemiology collaboration using WHO VigiBase"
    text: >-
      Sustained joint research with French partners; in 2025, contributed to seven VigiBase-related
      peer-reviewed papers, including three first-author papers.
  - title: "CANAL-AI (Caen–Nagoya Alliance for AI in Health Data)"
    text: >-
      International collaboration to develop privacy-preserving, federated workflows for hospital real-world
      data analyses in oncology-related research, with emphasis on cross-country harmonization, reproducible
      evaluation protocols, and operational feasibility under governance constraints.

experience:
  - title: "Responsible Biostatistician, Nagoya University Hospital (2020–2025)"
    text: >-
      Statistical responsibility for multiple regulated clinical research projects and investigator-initiated
      trials; extensive consultation and study design support across diverse clinical domains. Delivered
      tailored analytical strategies (multivariable modeling, survival analysis, mixed-effects modeling,
      meta-analysis, and machine-learning–assisted modeling) and supported interpretability-focused reporting
      for clinical stakeholders.
  - title: "Biostatistics training, Nagoya University"
    text: >-
      Doctoral-level training in biostatistics and applied clinical research methods, with experience in
      statistical analysis for observational studies and development of robust, reproducible analytical workflows.

