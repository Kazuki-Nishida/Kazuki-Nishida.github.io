summary: >-
  Physician and biostatistician with expertise in clinical epidemiology, real-world data, and medical AI.
  Experienced in designing and executing hospital-based observational studies and regulated clinical research
  as a responsible biostatistician, with strong capability in translating clinical questions into reproducible
  analytical protocols. Actively leading Franco-Japanese collaborations in pharmacoepidemiology and health data
  science (including WHO VigiBase research and CANAL-AI), and experienced in securing research funding as a
  principal investigator for privacy-preserving medical AI and federated learning initiatives.

